<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>ConectaTV - Redirecionando...</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{--bg:#08080d;--surface:#101018;--border:#262634;--fg:#f0f0f5;--fg2:#9a9ab2;--accent:#7c6cf0;--accent-fg:#b3a9ff;--ok:#2fd3b5;color-scheme:dark}
  body{background:var(--bg);color:var(--fg);font-family:'Inter',system-ui,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:40px;max-width:400px;width:100%;text-align:center;display:flex;flex-direction:column;gap:20px;align-items:center}
  .logo{display:flex;align-items:center;gap:10px;font-size:1.4rem;font-weight:900;letter-spacing:-.04em}
  .logo-mark{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--accent),#4f8cff);display:grid;place-items:center}
  .logo b{color:var(--ok)}
  .spinner{width:32px;height:32px;border-radius:50%;border:3px solid #ffffff22;border-top-color:var(--accent-fg);animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  p{color:var(--fg2);font-size:.9rem}
  .error{display:none;color:#ff5c6c;font-size:.85rem}
  a{color:var(--accent-fg);text-decoration:none}
  a:hover{text-decoration:underline}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap">
</head>
<body>
<div class="card">
  <div class="logo">
    <span class="logo-mark"><svg width="18" height="18" viewBox="0 0 24 24" fill="#fff"><path d="M8 5.5v13l11-6.5z"/></svg></span>
    <span>Conecta<b>TV</b></span>
  </div>
  <div class="spinner" id="spinner"></div>
  <p id="msg">Conectando ao servidor...</p>
  <p class="error" id="error">O servidor está offline no momento. Tente novamente mais tarde.</p>
</div>
<script>
var GIST_ID = "a9d6d1dfcf1bcd2889195e42190ce39d";
fetch("https://api.github.com/gists/" + GIST_ID)
  .then(function(r){ return r.json() })
  .then(function(data){
    var url = data.files["url.txt"].content.trim();
    if(url && url.startsWith("https://") && url !== "https://placeholder.trycloudflare.com"){
      document.getElementById("msg").textContent = "Redirecionando...";
      window.location.href = url;
    } else {
      document.getElementById("spinner").style.display = "none";
      document.getElementById("msg").style.display = "none";
      document.getElementById("error").style.display = "block";
    }
  })
  .catch(function(){
    document.getElementById("spinner").style.display = "none";
    document.getElementById("msg").style.display = "none";
    document.getElementById("error").style.display = "block";
  });
</script>
</body>
</html>
